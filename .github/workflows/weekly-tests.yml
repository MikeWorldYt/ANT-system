# Runs the Windows-only #[ignore] tests (Recycle Bin, PowerShell, updater) that the per-push run skips.
name: Weekly Windows tests

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ignored:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: FolderManager, crate: Applications/FolderManager/src-tauri, tauri: true }
          - { app: CreateNewStorage, crate: Applications/CreateNewStorage, tauri: false }
    defaults:
      run:
        shell: pwsh
        working-directory: Applications/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: matrix.tauri
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.tauri
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Applications/${{ matrix.app }}/pnpm-lock.yaml
      - name: Build the frontend
        if: matrix.tauri
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ matrix.crate }} -> target
      - name: Test, ignored ones included
        working-directory: ${{ matrix.crate }}
        run: cargo test --locked -- --include-ignored
