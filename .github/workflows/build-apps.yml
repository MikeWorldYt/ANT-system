# Tests and builds the ANT apps whenever their version changes on main and publishes a per-app GitHub Release
# with SHA256SUMS and latest.json (contract: spec/fm-security/plan.md section 6d).
# An app with src-tauri/ is built with Tauri and pnpm, one with only a Cargo.toml with cargo (its version lives there).
name: Build apps

on:
  push:
    branches: [main]
    paths:
      - "Applications/*/version.txt"
      - "Applications/CreateNewStorage/Cargo.toml"
  pull_request:
    paths:
      - "Applications/**"
      - ".github/workflows/build-apps.yml"
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to build (comma separated), e.g. FolderManager,CreateNewStorage"
        required: true
        default: "FolderManager,CreateNewStorage"

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APPS: ${{ github.event.inputs.apps }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          all="CreateNewStorage FolderManager"
          case "$EVENT" in
            workflow_dispatch) apps=$(echo "$INPUT_APPS" | tr ',' ' ') ;;
            pull_request) apps=$(git diff --name-only "$BASE_SHA" HEAD -- Applications | cut -d/ -f2 | sort -u) ;;
            push) apps=$(git diff --name-only "$BEFORE" HEAD -- 'Applications/*/version.txt' Applications/CreateNewStorage/Cargo.toml | cut -d/ -f2 | sort -u) ;;
          esac
          picked=$(for a in $apps; do echo " $all " | grep -q " $a " && echo "$a"; done | sort -u)
          json=$(printf '%s\n' $picked | jq -R . | jq -sc 'map(select(length > 0))')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          [ "$json" = "[]" ] && echo "any=false" >> "$GITHUB_OUTPUT" || echo "any=true" >> "$GITHUB_OUTPUT"
          echo "Apps: $json"

  # Releases only come from a green test run
  test:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
        working-directory: Applications/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect app kind
        id: kind
        run: |
          $tauri = Test-Path src-tauri/tauri.conf.json
          "tauri=$($tauri.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "crate=Applications/${{ matrix.app }}$(if ($tauri) { '/src-tauri' })" >> $env:GITHUB_OUTPUT
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.kind.outputs.tauri == 'true'
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.kind.outputs.tauri == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Applications/${{ matrix.app }}/pnpm-lock.yaml
      # The Rust build embeds web-dist, so the frontend is built before cargo test
      - name: Typecheck and build the frontend
        if: steps.kind.outputs.tauri == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm exec vite build
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ steps.kind.outputs.crate }} -> target
      - name: Test
        working-directory: ${{ steps.kind.outputs.crate }}
        run: cargo test --locked

  build:
    needs: [plan, test]
    if: needs.plan.outputs.any == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect app kind
        id: kind
        shell: pwsh
        run: |
          $tauri = Test-Path "Applications/${{ matrix.app }}/src-tauri/tauri.conf.json"
          $rust = (-not $tauri) -and (Test-Path "Applications/${{ matrix.app }}/Cargo.toml")
          "tauri=$($tauri.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "rust=$($rust.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.kind.outputs.tauri == 'true'
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.kind.outputs.tauri == 'true'
        with:
          node-version: 24
      - name: Build (Tauri)
        if: steps.kind.outputs.tauri == 'true'
        working-directory: Applications/${{ matrix.app }}
        shell: pwsh
        run: |
          # version.txt feeds the updater and tauri.conf.json feeds the executable, so they must agree
          $expected = (Select-String -Path version.txt -Pattern "StringStruct\('FileVersion',\s*'([\d.]+)'\)").Matches[0].Groups[1].Value
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (-not $conf.StartsWith($expected)) { throw "tauri.conf.json version '$conf' does not match version.txt '$expected'" }
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $crate = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($pkg -ne $conf -or $crate -ne $conf) { throw "package.json '$pkg' and Cargo.toml '$crate' must match tauri.conf.json '$conf'" }
          rustup toolchain install stable --profile minimal
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles nsis -- --locked
          New-Item -ItemType Directory -Force build-dist | Out-Null
          Copy-Item src-tauri/target/release/folder-manager.exe "build-dist/${{ matrix.app }}.exe"
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "The NSIS installer was not built" }
          Copy-Item $setup.FullName "build-dist/${{ matrix.app }}_installer.exe"
      - name: Build (Rust)
        if: steps.kind.outputs.rust == 'true'
        working-directory: Applications/${{ matrix.app }}
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          cargo build --release --locked
          New-Item -ItemType Directory -Force build-dist | Out-Null
          Copy-Item target/release/create-new-storage.exe "build-dist/${{ matrix.app }}.exe"
      - name: Check version
        id: version
        working-directory: Applications/${{ matrix.app }}
        shell: pwsh
        run: |
          $expected = if ("${{ steps.kind.outputs.rust }}" -eq "true") {
            (Select-String -Path Cargo.toml -Pattern '^version = "([\d.]+)"').Matches[0].Groups[1].Value
          } else {
            (Select-String -Path version.txt -Pattern "StringStruct\('FileVersion',\s*'([\d.]+)'\)").Matches[0].Groups[1].Value
          }
          $exe = "build-dist/${{ matrix.app }}.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $size = (Get-Item $exe).Length
          $minSize = if ("${{ steps.kind.outputs.rust }}" -eq "true") { 100KB } else { 1MB }
          if ($size -lt $minSize) { throw "$exe is only $size bytes" }
          $actual = (Get-Item $exe).VersionInfo.FileVersion
          # A Tauri executable may carry a pre-release tag after the numbers (2.0.1-beta); a Rust one carries none
          $sameVersion = ("${{ steps.kind.outputs.rust }}" -eq "true") -or $actual.StartsWith($expected)
          if (-not $sameVersion) { throw "exe FileVersion '$actual' does not match version.txt '$expected'" }
          "version=$expected" >> $env:GITHUB_OUTPUT
          "Built ${{ matrix.app }} $expected ($size bytes)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}_portable
          path: Applications/${{ matrix.app }}/build-dist/${{ matrix.app }}.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.kind.outputs.tauri == 'true'
        with:
          name: ${{ matrix.app }}_installer
          path: Applications/${{ matrix.app }}/build-dist/${{ matrix.app }}_installer.exe
          if-no-files-found: error

  build-unix:
    needs: [plan, test]
    if: needs.plan.outputs.any == 'true'
    name: ${{ matrix.app }}-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.matrix) }}
        os: [ubuntu-latest, macos-latest]
        include:
          - { os: ubuntu-latest, label: linux, bundle: deb }
          - { os: macos-latest, label: macos, bundle: dmg }
    defaults:
      run:
        shell: bash
        working-directory: Applications/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect app kind
        id: kind
        run: |
          if [ -f src-tauri/tauri.conf.json ]; then echo "tauri=true" >> "$GITHUB_OUTPUT"; else echo "tauri=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install Linux dependencies
        if: matrix.label == 'linux' && steps.kind.outputs.tauri == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.kind.outputs.tauri == 'true'
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.kind.outputs.tauri == 'true'
        with:
          node-version: 24
      - run: rustup toolchain install stable --profile minimal
      - name: Build (Tauri)
        if: steps.kind.outputs.tauri == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles ${{ matrix.bundle }} -- --locked
          echo "BIN=src-tauri/target/release/folder-manager" >> "$GITHUB_ENV"
          setup=$(ls src-tauri/target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.bundle }} | head -n 1)
          [ -n "$setup" ] || { echo "The ${{ matrix.bundle }} installer was not built"; exit 1; }
          cp "$setup" "${{ matrix.app }}-${{ matrix.label }}_installer.${{ matrix.bundle }}"
      - name: Build (Rust)
        if: steps.kind.outputs.tauri == 'false'
        run: |
          cargo test --locked
          cargo build --release --locked
          echo "BIN=target/release/create-new-storage" >> "$GITHUB_ENV"
      # tar keeps the executable bit, which an artifact upload would drop
      - name: Pack
        run: tar -czf "${{ matrix.app }}-${{ matrix.label }}_portable.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}-${{ matrix.label }}_portable
          path: Applications/${{ matrix.app }}/${{ matrix.app }}-${{ matrix.label }}_portable.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.kind.outputs.tauri == 'true'
        with:
          name: ${{ matrix.app }}-${{ matrix.label }}_installer
          path: Applications/${{ matrix.app }}/${{ matrix.app }}-${{ matrix.label }}_installer.${{ matrix.bundle }}
          if-no-files-found: error

  publish:
    needs: [plan, build, build-unix]
    # Pull requests only prove the build works; main gets the releases
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-unix.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APPS: ${{ needs.plan.outputs.matrix }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every artifact holds one file named for the release, except the Windows portable, which keeps the dist/ name
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: built
          merge-multiple: true
      # The tag carries the full version (2.4.5-beta), the one in tauri.conf.json or the CLI's Cargo.toml
      - name: Resolve tags
        run: |
          set -euo pipefail
          for app in $(jq -r '.[]' <<< "$APPS"); do
            conf="Applications/$app/src-tauri/tauri.conf.json"
            if [ -f "$conf" ]; then version=$(jq -r .version "$conf"); else version=$(grep -m1 -oP '^version = "\K[^"]+' "Applications/$app/Cargo.toml"); fi
            slug=$(echo "$app" | sed -E 's/([a-z])([A-Z])/\1-\2/g' | tr '[:upper:]' '[:lower:]')
            tag="$slug-v$version"
            # A draft from a failed run never created its tag, so it is redone
            if [ "$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then gh release delete "$tag" --yes; fi
            if gh release view "$tag" >/dev/null 2>&1 || gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::$tag already exists; bump the version of $app"
              exit 1
            fi
            echo "$app $version $slug $tag" >> tags.txt
          done
      - name: Publish releases
        run: |
          set -euo pipefail
          base="https://github.com/$GH_REPO/releases/download"
          while read -r app version slug tag; do
            out="release/$app"
            mkdir -p "$out"
            cp "built/$app.exe" "$out/${app}_portable.exe"
            for f in "built/${app}_installer.exe" built/"$app"-*_portable.* built/"$app"-*_installer.*; do
              if [ -e "$f" ]; then cp "$f" "$out/"; fi
            done
            files=()
            for f in "$out"/*; do files+=("$(basename "$f")"); done
            (cd "$out" && sha256sum -- "${files[@]}" > SHA256SUMS)
            prerelease=false
            case "$version" in *-*) prerelease=true ;; esac
            jq -n --arg app "$app" --arg version "$version" --arg tag "$tag" --arg commit "$GITHUB_SHA" \
              --arg url "$base/$tag" --argjson prerelease "$prerelease" --rawfile sums "$out/SHA256SUMS" '
              {schema: 1, app: $app, version: $version, tag: $tag, prerelease: $prerelease, commit: $commit,
               assets: ($sums | split("\n") | map(select(length > 0) | capture("^(?<sha256>[0-9a-f]{64}) [ *](?<name>.+)$"))
                 | map({(.name): {sha256, url: "\($url)/\(.name)"}}) | add)}' > "$out/latest.json"
            flags=(--latest=false)
            if [ "$prerelease" = true ]; then flags+=(--prerelease); fi
            # A draft is invisible to clients, so the release appears with every asset and latest.json at once
            gh release create "$tag" "${files[@]/#/$out/}" "$out/SHA256SUMS" --draft --target "$GITHUB_SHA" \
              --title "$app v$version" --notes "Built from $GITHUB_SHA." "${flags[@]}"
            gh release upload "$tag" "$out/latest.json"
            gh release edit "$tag" --draft=false --latest=false
            # The channel release holds only latest.json, so its URL never changes; it is the one asset replaced in place
            channel="$slug-latest"
            if ! gh release view "$channel" >/dev/null 2>&1; then
              gh release create "$channel" --target "$GITHUB_SHA" --title "$app update channel" \
                --notes "latest.json of the newest $app release." --prerelease --latest=false
            fi
            gh release upload "$channel" "$out/latest.json" --clobber
          done < tags.txt

  # Clients older than the latest.json updater still download dist/FolderManager.exe from main; drop this job once they are gone
  legacy-dist:
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && contains(fromJson(needs.plan.outputs.matrix), 'FolderManager') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      # The token stays in this checkout because the job pushes to main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FolderManager_portable
          path: built
      - name: Commit the executable to main
        run: |
          set -euo pipefail
          version=$(jq -r .version Applications/FolderManager/src-tauri/tauri.conf.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p Applications/FolderManager/dist
          cp built/FolderManager.exe Applications/FolderManager/dist/FolderManager.exe
          # dist/ is gitignored for local builds; this binary is the one tracked exception
          git add -f Applications/FolderManager/dist/FolderManager.exe
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "release(FolderManager): Build v$version executable"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 15))
          done
          echo "::error::Could not push dist/FolderManager.exe to main"
          exit 1
