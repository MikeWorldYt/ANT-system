# Builds the Windows executables of the ANT apps whenever their version.txt changes on main,
# commits them to Applications/<App>/dist and publishes a per-app GitHub Release.
name: Build apps

on:
  push:
    branches: [main]
    paths:
      - "Applications/*/version.txt"
  pull_request:
    paths:
      - "Applications/**"
      - ".github/workflows/build-apps.yml"
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to build (comma separated), e.g. FolderManager,CreateNewStorage"
        required: true
        default: "FolderManager,CreateNewStorage"

permissions:
  contents: write

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APPS: ${{ github.event.inputs.apps }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          all="CreateNewStorage FolderManager"
          case "$EVENT" in
            workflow_dispatch) apps=$(echo "$INPUT_APPS" | tr ',' ' ') ;;
            pull_request) apps=$(git diff --name-only "$BASE_SHA" HEAD -- Applications | cut -d/ -f2 | sort -u) ;;
            push) apps=$(git diff --name-only "$BEFORE" HEAD -- 'Applications/*/version.txt' | cut -d/ -f2 | sort -u) ;;
          esac
          # ant_core is shared, so a change there rebuilds every app
          if echo "$apps" | grep -qx ant_core; then apps="$all"; fi
          picked=$(for a in $apps; do echo " $all " | grep -q " $a " && echo "$a"; done | sort -u)
          json=$(printf '%s\n' $picked | jq -R . | jq -sc 'map(select(length > 0))')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          [ "$json" = "[]" ] && echo "any=false" >> "$GITHUB_OUTPUT" || echo "any=true" >> "$GITHUB_OUTPUT"
          echo "Apps: $json"

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pyyaml
      - name: Build
        working-directory: Applications/${{ matrix.app }}
        shell: pwsh
        run: |
          $spec = Get-ChildItem *.spec | Select-Object -First 1
          python -m PyInstaller $spec.Name --noconfirm --clean --distpath build-dist --workpath build-work
      - name: Check version
        id: version
        working-directory: Applications/${{ matrix.app }}
        shell: pwsh
        run: |
          $expected = (Select-String -Path version.txt -Pattern "StringStruct\('FileVersion',\s*'([\d.]+)'\)").Matches[0].Groups[1].Value
          $exe = "build-dist/${{ matrix.app }}.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB) { throw "$exe is only $size bytes" }
          $actual = (Get-Item $exe).VersionInfo.FileVersion
          if ($actual -ne $expected) { throw "exe FileVersion '$actual' does not match version.txt '$expected'" }
          "version=$expected" >> $env:GITHUB_OUTPUT
          "Built ${{ matrix.app }} $expected ($size bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: Applications/${{ matrix.app }}/build-dist/${{ matrix.app }}.exe
          if-no-files-found: error

  publish:
    needs: [plan, build]
    # Pull requests only prove the build works; main gets the commit and the releases
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Commit executables to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in built/*/; do
            app=$(basename "$dir")
            version=$(grep -oP "StringStruct\('FileVersion',\s*'\K[\d.]+" "Applications/$app/version.txt")
            mkdir -p "Applications/$app/dist"
            cp "$dir$app.exe" "Applications/$app/dist/$app.exe"
            # dist/ is gitignored for local builds; release binaries are the one tracked exception
            git add -f "Applications/$app/dist/$app.exe"
            if ! git diff --cached --quiet; then
              git commit -m "release($app): Build v$version executable"
            fi
          done
          git push
      - name: Publish releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in built/*/; do
            app=$(basename "$dir")
            version=$(grep -oP "StringStruct\('FileVersion',\s*'\K[\d.]+" "Applications/$app/version.txt")
            slug=$(echo "$app" | sed -E 's/([a-z])([A-Z])/\1-\2/g' | tr '[:upper:]' '[:lower:]')
            tag="$slug-v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$dir$app.exe" --clobber
            else
              gh release create "$tag" "$dir$app.exe" --title "$app v$version" --notes "Built from $GITHUB_SHA." --latest=false
            fi
          done
