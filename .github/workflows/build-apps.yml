# Builds the Windows executables of the ANT apps whenever their version changes on main,
# commits them to Applications/<App>/dist and publishes a per-app GitHub Release.
# An app with src-tauri/ is built with Tauri and pnpm, one with only a Cargo.toml with cargo (its version lives there).
name: Build apps

on:
  push:
    branches: [main]
    paths:
      - "Applications/*/version.txt"
      - "Applications/CreateNewStorage/Cargo.toml"
  pull_request:
    paths:
      - "Applications/**"
      - ".github/workflows/build-apps.yml"
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to build (comma separated), e.g. FolderManager,CreateNewStorage"
        required: true
        default: "FolderManager,CreateNewStorage"

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APPS: ${{ github.event.inputs.apps }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          all="CreateNewStorage FolderManager"
          case "$EVENT" in
            workflow_dispatch) apps=$(echo "$INPUT_APPS" | tr ',' ' ') ;;
            pull_request) apps=$(git diff --name-only "$BASE_SHA" HEAD -- Applications | cut -d/ -f2 | sort -u) ;;
            push) apps=$(git diff --name-only "$BEFORE" HEAD -- 'Applications/*/version.txt' Applications/CreateNewStorage/Cargo.toml | cut -d/ -f2 | sort -u) ;;
          esac
          picked=$(for a in $apps; do echo " $all " | grep -q " $a " && echo "$a"; done | sort -u)
          json=$(printf '%s\n' $picked | jq -R . | jq -sc 'map(select(length > 0))')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          [ "$json" = "[]" ] && echo "any=false" >> "$GITHUB_OUTPUT" || echo "any=true" >> "$GITHUB_OUTPUT"
          echo "Apps: $json"

  # Releases only come from a green test run
  test:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
        working-directory: Applications/${{ matrix.app }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Detect app kind
        id: kind
        run: |
          $tauri = Test-Path src-tauri/tauri.conf.json
          "tauri=$($tauri.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "crate=Applications/${{ matrix.app }}$(if ($tauri) { '/src-tauri' })" >> $env:GITHUB_OUTPUT
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        if: steps.kind.outputs.tauri == 'true'
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.kind.outputs.tauri == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Applications/${{ matrix.app }}/pnpm-lock.yaml
      # The Rust build embeds web-dist, so the frontend is built before cargo test
      - name: Typecheck and build the frontend
        if: steps.kind.outputs.tauri == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm exec vite build
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ steps.kind.outputs.crate }} -> target
      - name: Test
        working-directory: ${{ steps.kind.outputs.crate }}
        run: cargo test --locked

  build:
    needs: [plan, test]
    if: needs.plan.outputs.any == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Detect app kind
        id: kind
        shell: pwsh
        run: |
          $tauri = Test-Path "Applications/${{ matrix.app }}/src-tauri/tauri.conf.json"
          $rust = (-not $tauri) -and (Test-Path "Applications/${{ matrix.app }}/Cargo.toml")
          "tauri=$($tauri.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "rust=$($rust.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        if: steps.kind.outputs.tauri == 'true'
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.kind.outputs.tauri == 'true'
        with:
          node-version: 24
      - name: Build (Tauri)
        if: steps.kind.outputs.tauri == 'true'
        working-directory: Applications/${{ matrix.app }}
        shell: pwsh
        run: |
          # version.txt feeds the updater and tauri.conf.json feeds the executable, so they must agree
          $expected = (Select-String -Path version.txt -Pattern "StringStruct\('FileVersion',\s*'([\d.]+)'\)").Matches[0].Groups[1].Value
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (-not $conf.StartsWith($expected)) { throw "tauri.conf.json version '$conf' does not match version.txt '$expected'" }
          rustup toolchain install stable --profile minimal
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles nsis -- --locked
          New-Item -ItemType Directory -Force build-dist | Out-Null
          Copy-Item src-tauri/target/release/folder-manager.exe "build-dist/${{ matrix.app }}.exe"
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "The NSIS installer was not built" }
          Copy-Item $setup.FullName "build-dist/${{ matrix.app }}_installer.exe"
      - name: Build (Rust)
        if: steps.kind.outputs.rust == 'true'
        working-directory: Applications/${{ matrix.app }}
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          cargo build --release --locked
          New-Item -ItemType Directory -Force build-dist | Out-Null
          Copy-Item target/release/create-new-storage.exe "build-dist/${{ matrix.app }}.exe"
      - name: Check version
        id: version
        working-directory: Applications/${{ matrix.app }}
        shell: pwsh
        run: |
          $expected = if ("${{ steps.kind.outputs.rust }}" -eq "true") {
            (Select-String -Path Cargo.toml -Pattern '^version = "([\d.]+)"').Matches[0].Groups[1].Value
          } else {
            (Select-String -Path version.txt -Pattern "StringStruct\('FileVersion',\s*'([\d.]+)'\)").Matches[0].Groups[1].Value
          }
          $exe = "build-dist/${{ matrix.app }}.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $size = (Get-Item $exe).Length
          $minSize = if ("${{ steps.kind.outputs.rust }}" -eq "true") { 100KB } else { 1MB }
          if ($size -lt $minSize) { throw "$exe is only $size bytes" }
          $actual = (Get-Item $exe).VersionInfo.FileVersion
          # A Tauri executable may carry a pre-release tag after the numbers (2.0.1-beta); a Rust one carries none
          $sameVersion = ("${{ steps.kind.outputs.rust }}" -eq "true") -or $actual.StartsWith($expected)
          if (-not $sameVersion) { throw "exe FileVersion '$actual' does not match version.txt '$expected'" }
          "version=$expected" >> $env:GITHUB_OUTPUT
          "Built ${{ matrix.app }} $expected ($size bytes)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.app }}_portable
          path: Applications/${{ matrix.app }}/build-dist/${{ matrix.app }}.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.kind.outputs.tauri == 'true'
        with:
          name: ${{ matrix.app }}_installer
          path: Applications/${{ matrix.app }}/build-dist/${{ matrix.app }}_installer.exe
          if-no-files-found: error

  build-unix:
    needs: [plan, test]
    if: needs.plan.outputs.any == 'true'
    name: ${{ matrix.app }}-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.matrix) }}
        os: [ubuntu-latest, macos-latest]
        include:
          - { os: ubuntu-latest, label: linux, bundle: deb }
          - { os: macos-latest, label: macos, bundle: dmg }
    defaults:
      run:
        shell: bash
        working-directory: Applications/${{ matrix.app }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Detect app kind
        id: kind
        run: |
          if [ -f src-tauri/tauri.conf.json ]; then echo "tauri=true" >> "$GITHUB_OUTPUT"; else echo "tauri=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install Linux dependencies
        if: matrix.label == 'linux' && steps.kind.outputs.tauri == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        if: steps.kind.outputs.tauri == 'true'
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.kind.outputs.tauri == 'true'
        with:
          node-version: 24
      - run: rustup toolchain install stable --profile minimal
      - name: Build (Tauri)
        if: steps.kind.outputs.tauri == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles ${{ matrix.bundle }} -- --locked
          echo "BIN=src-tauri/target/release/folder-manager" >> "$GITHUB_ENV"
          setup=$(ls src-tauri/target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.bundle }} | head -n 1)
          [ -n "$setup" ] || { echo "The ${{ matrix.bundle }} installer was not built"; exit 1; }
          cp "$setup" "${{ matrix.app }}-${{ matrix.label }}_installer.${{ matrix.bundle }}"
      - name: Build (Rust)
        if: steps.kind.outputs.tauri == 'false'
        run: |
          cargo test --locked
          cargo build --release --locked
          echo "BIN=target/release/create-new-storage" >> "$GITHUB_ENV"
      # tar keeps the executable bit, which an artifact upload would drop
      - name: Pack
        run: tar -czf "${{ matrix.app }}-${{ matrix.label }}_portable.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.app }}-${{ matrix.label }}_portable
          path: Applications/${{ matrix.app }}/${{ matrix.app }}-${{ matrix.label }}_portable.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.kind.outputs.tauri == 'true'
        with:
          name: ${{ matrix.app }}-${{ matrix.label }}_installer
          path: Applications/${{ matrix.app }}/${{ matrix.app }}-${{ matrix.label }}_installer.${{ matrix.bundle }}
          if-no-files-found: error

  publish:
    needs: [plan, build, build-unix]
    # Pull requests only prove the build works; main gets the commit and the releases
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-unix.result != 'failure' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The token stays in the checkout because this job pushes the executables to main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Every artifact holds one file named for the release, except the Windows portable, which keeps the dist/ name the updater reads
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: built
          merge-multiple: true
      - name: Put each executable in its app folder
        shell: bash
        run: |
          for exe in built/*.exe; do
            case "$exe" in *_installer.exe) continue ;; esac
            app=$(basename "$exe" .exe)
            mkdir -p "built/$app"
            mv "$exe" "built/$app/"
          done
      - name: Commit executables to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in built/*/; do
            app=$(basename "$dir")
            if [ -f "Applications/$app/version.txt" ]; then
              version=$(grep -oP "StringStruct\('FileVersion',\s*'\K[\d.]+" "Applications/$app/version.txt")
            else
              version=$(grep -m1 -oP '^version = "\K[\d.]+' "Applications/$app/Cargo.toml")
            fi
            mkdir -p "Applications/$app/dist"
            cp "$dir$app.exe" "Applications/$app/dist/$app.exe"
            # dist/ is gitignored for local builds; release binaries are the one tracked exception
            git add -f "Applications/$app/dist/$app.exe"
            if ! git diff --cached --quiet; then
              git commit -m "release($app): Build v$version executable"
            fi
          done
          git push
      - name: Publish releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in built/*/; do
            app=$(basename "$dir")
            if [ -f "Applications/$app/version.txt" ]; then
              version=$(grep -oP "StringStruct\('FileVersion',\s*'\K[\d.]+" "Applications/$app/version.txt")
            else
              version=$(grep -m1 -oP '^version = "\K[\d.]+' "Applications/$app/Cargo.toml")
            fi
            slug=$(echo "$app" | sed -E 's/([a-z])([A-Z])/\1-\2/g' | tr '[:upper:]' '[:lower:]')
            tag="$slug-v$version"
            cp "$dir$app.exe" "built/${app}_portable.exe"
            assets=("built/${app}_portable.exe")
            for f in "built/${app}_installer.exe" built/$app-*_portable.* built/$app-*_installer.*; do
              [ -e "$f" ] && assets+=("$f")
            done
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${assets[@]}" --clobber
            else
              gh release create "$tag" "${assets[@]}" --title "$app v$version" --notes "Built from $GITHUB_SHA." --latest=false
            fi
          done
