# Builds the Windows executables of the ANT apps whenever their version changes on main,
# commits them to Applications/<App>/dist and publishes a per-app GitHub Release.
# An app with src-tauri/ is built with Tauri and pnpm, one with only a Cargo.toml with cargo
# (its version lives there), and any other app with PyInstaller (its version lives in version.txt).
name: Build apps

on:
  push:
    branches: [main]
    paths:
      - "Applications/*/version.txt"
      - "Applications/CreateNewStorage/Cargo.toml"
  pull_request:
    paths:
      - "Applications/**"
      - ".github/workflows/build-apps.yml"
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to build (comma separated), e.g. FolderManager,CreateNewStorage"
        required: true
        default: "FolderManager,CreateNewStorage"

permissions:
  contents: write

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
      native: ${{ steps.pick.outputs.native }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APPS: ${{ github.event.inputs.apps }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          all="CreateNewStorage FolderManager"
          case "$EVENT" in
            workflow_dispatch) apps=$(echo "$INPUT_APPS" | tr ',' ' ') ;;
            pull_request) apps=$(git diff --name-only "$BASE_SHA" HEAD -- Applications | cut -d/ -f2 | sort -u) ;;
            push) apps=$(git diff --name-only "$BEFORE" HEAD -- 'Applications/*/version.txt' Applications/CreateNewStorage/Cargo.toml | cut -d/ -f2 | sort -u) ;;
          esac
          # ant_core is shared, so a change there rebuilds every app
          if echo "$apps" | grep -qx ant_core; then apps="$all"; fi
          picked=$(for a in $apps; do echo " $all " | grep -q " $a " && echo "$a"; done | sort -u)
          json=$(printf '%s\n' $picked | jq -R . | jq -sc 'map(select(length > 0))')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          [ "$json" = "[]" ] && echo "any=false" >> "$GITHUB_OUTPUT" || echo "any=true" >> "$GITHUB_OUTPUT"
          # Python apps only run on Windows; the Rust and Tauri ones also get Linux and macOS builds
          native=$(for a in $picked; do { [ -f "Applications/$a/Cargo.toml" ] || [ -f "Applications/$a/src-tauri/tauri.conf.json" ]; } && echo "$a"; done | jq -R . | jq -sc 'map(select(length > 0))')
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Apps: $json"

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect app kind
        id: kind
        shell: pwsh
        run: |
          $tauri = Test-Path "Applications/${{ matrix.app }}/src-tauri/tauri.conf.json"
          $rust = (-not $tauri) -and (Test-Path "Applications/${{ matrix.app }}/Cargo.toml")
          "tauri=$($tauri.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "rust=$($rust.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "python=$((-not $tauri -and -not $rust).ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v6
        if: steps.kind.outputs.python == 'true'
        with:
          python-version: "3.13"
      - name: Install build tools
        if: steps.kind.outputs.python == 'true'
        run: python -m pip install --upgrade pip pyinstaller pyyaml
      - name: Build
        if: steps.kind.outputs.python == 'true'
        working-directory: Applications/${{ matrix.app }}
        shell: pwsh
        run: |
          $spec = Get-ChildItem *.spec | Select-Object -First 1
          python -m PyInstaller $spec.Name --noconfirm --clean --distpath build-dist --workpath build-work
      - uses: pnpm/action-setup@v5
        if: steps.kind.outputs.tauri == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v6
        if: steps.kind.outputs.tauri == 'true'
        with:
          node-version: 24
      - name: Build (Tauri)
        if: steps.kind.outputs.tauri == 'true'
        working-directory: Applications/${{ matrix.app }}
        shell: pwsh
        run: |
          # version.txt feeds the updater and tauri.conf.json feeds the executable, so they must agree
          $expected = (Select-String -Path version.txt -Pattern "StringStruct\('FileVersion',\s*'([\d.]+)'\)").Matches[0].Groups[1].Value
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (-not $conf.StartsWith($expected)) { throw "tauri.conf.json version '$conf' does not match version.txt '$expected'" }
          rustup toolchain install stable --profile minimal
          pnpm install --frozen-lockfile
          pnpm tauri build --no-bundle -- --locked
          New-Item -ItemType Directory -Force build-dist | Out-Null
          Copy-Item src-tauri/target/release/folder-manager.exe "build-dist/${{ matrix.app }}.exe"
      - name: Build (Rust)
        if: steps.kind.outputs.rust == 'true'
        working-directory: Applications/${{ matrix.app }}
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          cargo test --locked
          cargo build --release --locked
          New-Item -ItemType Directory -Force build-dist | Out-Null
          Copy-Item target/release/create-new-storage.exe "build-dist/${{ matrix.app }}.exe"
      - name: Check version
        id: version
        working-directory: Applications/${{ matrix.app }}
        shell: pwsh
        run: |
          $expected = if ("${{ steps.kind.outputs.rust }}" -eq "true") {
            (Select-String -Path Cargo.toml -Pattern '^version = "([\d.]+)"').Matches[0].Groups[1].Value
          } else {
            (Select-String -Path version.txt -Pattern "StringStruct\('FileVersion',\s*'([\d.]+)'\)").Matches[0].Groups[1].Value
          }
          $exe = "build-dist/${{ matrix.app }}.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $size = (Get-Item $exe).Length
          $minSize = if ("${{ steps.kind.outputs.rust }}" -eq "true") { 100KB } else { 1MB }
          if ($size -lt $minSize) { throw "$exe is only $size bytes" }
          $actual = (Get-Item $exe).VersionInfo.FileVersion
          # A Tauri executable may carry a pre-release tag after the numbers (2.0.1-beta); a Rust one carries none
          $sameVersion = if ("${{ steps.kind.outputs.rust }}" -eq "true") { $true } elseif ("${{ steps.kind.outputs.tauri }}" -eq "true") { $actual.StartsWith($expected) } else { $actual -eq $expected }
          if (-not $sameVersion) { throw "exe FileVersion '$actual' does not match version.txt '$expected'" }
          "version=$expected" >> $env:GITHUB_OUTPUT
          "Built ${{ matrix.app }} $expected ($size bytes)"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app }}
          path: Applications/${{ matrix.app }}/build-dist/${{ matrix.app }}.exe
          if-no-files-found: error

  build-unix:
    needs: plan
    if: needs.plan.outputs.native != '[]'
    name: ${{ matrix.app }}-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.native) }}
        os: [ubuntu-latest, macos-latest]
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: macos-latest, label: macos }
    defaults:
      run:
        shell: bash
        working-directory: Applications/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect app kind
        id: kind
        run: |
          if [ -f src-tauri/tauri.conf.json ]; then echo "tauri=true" >> "$GITHUB_OUTPUT"; else echo "tauri=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install Linux dependencies
        if: matrix.label == 'linux' && steps.kind.outputs.tauri == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - uses: pnpm/action-setup@v5
        if: steps.kind.outputs.tauri == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v6
        if: steps.kind.outputs.tauri == 'true'
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (Tauri)
        if: steps.kind.outputs.tauri == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --no-bundle -- --locked
          echo "BIN=src-tauri/target/release/folder-manager" >> "$GITHUB_ENV"
      - name: Build (Rust)
        if: steps.kind.outputs.tauri == 'false'
        run: |
          cargo test --locked
          cargo build --release --locked
          echo "BIN=target/release/create-new-storage" >> "$GITHUB_ENV"
      # tar keeps the executable bit, which an artifact upload would drop
      - name: Pack
        run: tar -czf "${{ matrix.app }}-${{ matrix.label }}.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
      - uses: actions/upload-artifact@v6
        with:
          name: unix-${{ matrix.app }}-${{ matrix.label }}
          path: Applications/${{ matrix.app }}/${{ matrix.app }}-${{ matrix.label }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [plan, build, build-unix]
    # Pull requests only prove the build works; main gets the commit and the releases
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-unix.result != 'failure' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: built
          pattern: "!unix-*"
      - uses: actions/download-artifact@v6
        with:
          path: built-unix
          pattern: unix-*
          merge-multiple: true
      # download-artifact v5+ unpacks a single artifact straight into the folder, so each app folder is rebuilt here
      - name: Put each executable in its app folder
        shell: bash
        run: |
          for exe in built/*.exe; do
            [ -e "$exe" ] || continue
            app=$(basename "$exe" .exe)
            mkdir -p "built/$app"
            mv "$exe" "built/$app/"
          done
      - name: Commit executables to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in built/*/; do
            app=$(basename "$dir")
            if [ -f "Applications/$app/version.txt" ]; then
              version=$(grep -oP "StringStruct\('FileVersion',\s*'\K[\d.]+" "Applications/$app/version.txt")
            else
              version=$(grep -m1 -oP '^version = "\K[\d.]+' "Applications/$app/Cargo.toml")
            fi
            mkdir -p "Applications/$app/dist"
            cp "$dir$app.exe" "Applications/$app/dist/$app.exe"
            # dist/ is gitignored for local builds; release binaries are the one tracked exception
            git add -f "Applications/$app/dist/$app.exe"
            if ! git diff --cached --quiet; then
              git commit -m "release($app): Build v$version executable"
            fi
          done
          git push
      - name: Publish releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in built/*/; do
            app=$(basename "$dir")
            if [ -f "Applications/$app/version.txt" ]; then
              version=$(grep -oP "StringStruct\('FileVersion',\s*'\K[\d.]+" "Applications/$app/version.txt")
            else
              version=$(grep -m1 -oP '^version = "\K[\d.]+' "Applications/$app/Cargo.toml")
            fi
            slug=$(echo "$app" | sed -E 's/([a-z])([A-Z])/\1-\2/g' | tr '[:upper:]' '[:lower:]')
            tag="$slug-v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$dir$app.exe" --clobber
            else
              gh release create "$tag" "$dir$app.exe" --title "$app v$version" --notes "Built from $GITHUB_SHA." --latest=false
            fi
            # Linux and macOS builds belong to the release created above
            if compgen -G "built-unix/$app-*.tar.gz" >/dev/null; then
              gh release upload "$tag" built-unix/$app-*.tar.gz --clobber
            fi
          done
