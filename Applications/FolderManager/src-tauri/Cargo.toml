[package]
name = "folder-manager"
version = "2.3.1-beta"
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "folder_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-notification = "2"
notify = "8.2.0"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62.2"

[patch.crates-io]
wry = { path = "patches/wry" }
